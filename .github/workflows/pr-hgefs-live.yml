name: PR NOAA HGEFS live

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/hgefs*.ts"
      - "src/**/aigefs*.ts"
      - "src/**/gefs*.ts"
      - "src/catalog/models.ts"
      - "src/schema/unified-api.ts"
      - "scripts/live-smoke-hgefs.ts"
      - ".github/workflows/pr-hgefs-live.yml"
      - "package.json"

concurrency:
  group: pr-hgefs-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned live-test environment
        run: docker build --target live-test -t weather-for-grown-ups:live-test .
      - name: Query live NOAA HGEFS composition
        run: docker run --rm weather-for-grown-ups:live-test npm run test:live:hgefs

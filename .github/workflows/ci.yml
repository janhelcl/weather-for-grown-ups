name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run test:coverage

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run pack:check
      - name: Install packed package and invoke package-name bin
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" --no-audit --no-fund "./$tarball"
          "$prefix/node_modules/.bin/weather-for-grown-ups" --help
          test -x "$prefix/node_modules/.bin/wfg"
          test -x "$prefix/node_modules/.bin/wfg-mcp"
          test -x "$prefix/node_modules/.bin/wfg-mcp-http"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t weather-for-grown-ups:test .
      - run: docker run --rm weather-for-grown-ups:test --help
      - name: Verify bundled wgrib2
        run: docker run --rm --entrypoint /opt/conda/bin/wgrib2 weather-for-grown-ups:test -version 2>&1 | grep -Fx "3.8.0"
      - name: Verify HTTP MCP container entrypoint
        run: |
          set -euo pipefail
          container_id="$(docker run -d --rm \
            -p 127.0.0.1:3000:3000 \
            -e WFG_MCP_HOST=0.0.0.0 \
            -e WFG_MCP_ALLOWED_HOSTS=localhost,127.0.0.1 \
            weather-for-grown-ups:test mcp-http)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error \
              -H 'Host: localhost' \
              http://127.0.0.1:3000/healthz | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 0.5
          done
          docker logs "$container_id"
          exit 1

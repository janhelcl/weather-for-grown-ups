name: Architecture import migration

on:
  push:
    branches:
      - architecture/lower-layer-boundary-pass

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move contracts to canonical import paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          decoder_names = {"DecodedValue", "ForecastInterval", "GribDecoderName", "GridPoint"}
          gefs_names = {
              "GEFS_MAX_FORECAST_HOUR",
              "GEFS_FORECAST_STEP_HOURS",
              "GEFS_TOTAL_NATIVE_FORECAST_STEPS",
          }

          def format_import(type_only: bool, items: list[str], source: str) -> str:
              prefix = "import type" if type_only else "import"
              one_line = f'{prefix} {{ {", ".join(items)} }} from "{source}";'
              if len(one_line) <= 100 and len(items) <= 3:
                  return one_line
              body = "".join(f"  {item},\n" for item in items)
              return f'{prefix} {{\n{body}}} from "{source}";'

          def move_named_imports(
              text: str,
              old_source: str,
              new_source: str,
              names: set[str],
              old_type_only: bool,
              moved_type_only: bool,
          ) -> str:
              type_token = r"\s+type" if old_type_only else ""
              pattern = re.compile(
                  rf'import{type_token}\s*\{{(?P<body>[^;{{}}]*?)\}}\s*from\s*["\']{re.escape(old_source)}["\'];',
                  re.S,
              )

              def replace(match: re.Match[str]) -> str:
                  items = [
                      re.sub(r"\s+", " ", item.strip())
                      for item in match.group("body").split(",")
                      if item.strip()
                  ]
                  moved: list[str] = []
                  kept: list[str] = []
                  for item in items:
                      base = item.split(" as ", 1)[0].strip()
                      (moved if base in names else kept).append(item)
                  if not moved:
                      return match.group(0)
                  rewritten = [format_import(moved_type_only, moved, new_source)]
                  if kept:
                      rewritten.append(format_import(old_type_only, kept, old_source))
                  return "\n".join(rewritten)

              return pattern.sub(replace, text)

          files = list(Path("src/core").glob("*.ts")) + list(Path("test").glob("*.ts"))
          for path in files:
              original = path.read_text()
              text = original
              if path.parts[0] == "src":
                  text = move_named_imports(
                      text, "./types.js", "../types/decoded.js", decoder_names, True, True
                  )
                  text = move_named_imports(
                      text, "./types.js", "../types/decoded.js", decoder_names, False, True
                  )
                  text = move_named_imports(
                      text, "./gefs-time.js", "../catalog/gefs.js", gefs_names, False, False
                  )
              else:
                  text = move_named_imports(
                      text,
                      "../src/core/types.js",
                      "../src/types/decoded.js",
                      decoder_names,
                      True,
                      True,
                  )
                  text = move_named_imports(
                      text,
                      "../src/core/types.js",
                      "../src/types/decoded.js",
                      decoder_names,
                      False,
                      True,
                  )
              if text != original:
                  path.write_text(text)

          stale_patterns = [
              re.compile(r'import(?:\s+type)?\s*\{[^;{}]*(?:DecodedValue|ForecastInterval|GribDecoderName|GridPoint)[^;{}]*\}\s*from\s*["\']\./types\.js["\'];', re.S),
              re.compile(r'import(?:\s+type)?\s*\{[^;{}]*(?:DecodedValue|ForecastInterval|GribDecoderName|GridPoint)[^;{}]*\}\s*from\s*["\']\.\./src/core/types\.js["\'];', re.S),
              re.compile(r'import\s*\{[^;{}]*GEFS_(?:MAX_FORECAST_HOUR|FORECAST_STEP_HOURS|TOTAL_NATIVE_FORECAST_STEPS)[^;{}]*\}\s*from\s*["\']\./gefs-time\.js["\'];', re.S),
          ]
          for path in files:
              text = path.read_text()
              for pattern in stale_patterns:
                  if pattern.search(text):
                      raise SystemExit(f"stale architectural import remains in {path}")
          PY
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src test
          git commit -m "Architecture: migrate callers to canonical contracts"
          git push

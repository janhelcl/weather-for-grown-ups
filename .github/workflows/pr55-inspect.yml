name: PR55 decoder audit

on:
  pull_request:

jobs:
  audit:
    if: github.event.pull_request.number == 55
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate decoder provenance and runtime references
        run: |
          set -euo pipefail
          echo '=== core hard-coded decoder provenance with context ==='
          grep -RInC4E 'decoder: "wgrib2"|decoder !== "wgrib2"|decoder: "wgrib2";' src/core || true
          echo '=== decoder interfaces ==='
          grep -RInC2E 'interface .*Decoder|decoder\?:' src/core src/grib || true

name: Release npm package

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release-npm.yml"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[npm-release-recovery]')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Verify release tag matches package version
        run: test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
      - id: version
        name: Check whether version is already published
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version --json >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify publish payload
        if: steps.version.outputs.published != 'true'
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          prefix="$(mktemp -d)"
          npm install --prefix "$prefix" --no-audit --no-fund "./$tarball"
          "$prefix/node_modules/.bin/weather-for-grown-ups" --help
      - name: Publish to npm
        if: steps.version.outputs.published != 'true'
        run: npm publish
      - name: Version already published
        if: steps.version.outputs.published == 'true'
        run: echo "$RELEASE_TAG is already on npm; nothing to publish."

name: temporary-enforce-ensemble-run-resolution

on:
  push:
    branches:
      - perf/request-budget-and-batched-execution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-budget-and-batched-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python scripts/tmp_enforce_ensemble_run_resolution.py
      - run: npm run typecheck
      - run: npx vitest run test/ensemble-member-execution.test.ts test/aifs-ens.test.ts test/aigefs.test.ts test/icon-d2-eps.test.ts test/pe-arome.test.ts test/architecture-boundaries.test.ts
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-enforce-ensemble-run-resolution.yml scripts/tmp_enforce_ensemble_run_resolution.py
          git add src/core/ensemble-member-execution.ts src/core/aifs-ens.ts src/core/aigefs.ts src/core/icon-d2-eps.ts src/core/pe-arome.ts test/aifs-ens.test.ts test/aigefs.test.ts test/icon-d2-eps.test.ts test/pe-arome.test.ts test/architecture-boundaries.test.ts docs/ARCHITECTURE.md
          git commit -m "refactor: require ensemble run resolution before payloads"
          git push origin HEAD:perf/request-budget-and-batched-execution

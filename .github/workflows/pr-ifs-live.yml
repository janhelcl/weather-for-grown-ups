name: PR ECMWF IFS live

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/ifs*.ts"
      - "src/sources/ifs-open-data.ts"
      - "src/cache/ifs-open-data-cache.ts"
      - "scripts/live-smoke-ifs.ts"
      - ".github/workflows/pr-ifs-live.yml"
      - "package.json"

concurrency:
  group: pr-ifs-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned live-test environment
        run: docker build --target live-test -t weather-for-grown-ups:live-test .
      - name: Query live ECMWF IFS Open Data
        run: docker run --rm weather-for-grown-ups:live-test npm run test:live:ifs

name: Sync v0.5.2 release metadata

on:
  push:
    branches:
      - release/v0.5.2

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchronize package and lockfile version
        run: npm version 0.5.2 --no-git-tag-version --allow-same-version
      - name: Commit synchronized metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Release metadata already synchronized."
            exit 0
          fi
          git commit -m "chore: sync v0.5.2 lockfile"
          git push origin HEAD:release/v0.5.2

name: PR GDEX host failover debug

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gdex-host-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare GDEX THREDDS hosts
        shell: bash
        run: |
          set -u
          path='/thredds/ncss/grid/files/g/d084001/2026/20260824/gfs.0p25.2026082400.f006.grib2?var=Temperature_isobaric&latitude=50&longitude=14&time=all&accept=csv'
          for host in tds.gdex.ucar.edu thredds.rda.ucar.edu; do
            echo "=== $host ==="
            code=$(curl --show-error --silent --max-time 45 -o /tmp/out -w '%{http_code}' "https://$host$path" || true)
            echo "HTTP $code"
            head -c 300 /tmp/out 2>/dev/null || true
            echo
          done

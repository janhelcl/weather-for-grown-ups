name: PR IGRA verification

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-igra-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned live-test environment
        run: docker build --target live-test -t weather-for-grown-ups:live-test .
      - name: Verify recent GFS archive against Praha-Libus radiosonde
        run: docker run --rm weather-for-grown-ups:live-test npm run test:live:igra
      - name: Summarize recent GFS skill against Praha-Libus radiosondes
        run: docker run --rm weather-for-grown-ups:live-test npm run test:live:igra-skill

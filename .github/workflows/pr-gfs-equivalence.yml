name: PR GFS equivalence

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gfs-equivalence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned live-test environment
        run: docker build --target live-test -t weather-for-grown-ups:live-test .
      - name: Compare operational and archived GFS grids
        run: docker run --rm weather-for-grown-ups:live-test npm run test:live:gfs-equivalence

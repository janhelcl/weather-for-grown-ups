name: temporary efficiency architecture pass

on:
  push:
    branches:
      - perf/request-budget-and-batched-execution

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-budget-and-batched-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply efficiency architecture patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new))

          # AIGFS: bounded time-range execution.
          p = Path('src/core/aigfs.ts')
          t = p.read_text()
          t = t.replace('import { computeAreaDistribution } from "./area-distribution.js";\n', 'import { computeAreaDistribution } from "./area-distribution.js";\nimport { mapConcurrent } from "./concurrency.js";\n')
          t = t.replace('const MAX_NATIVE_STEPS = 65;\n', 'const MAX_NATIVE_STEPS = 65;\nexport const DEFAULT_AIGFS_STEP_CONCURRENCY = 4;\n')
          t = t.replace('  areaGridDecoder?: Wgrib2GridDecoder;\n}', '  areaGridDecoder?: Wgrib2GridDecoder;\n  concurrency?: number;\n}')
          t = t.replace('  private readonly areaGridDecoder: Wgrib2GridDecoder;\n', '  private readonly areaGridDecoder: Wgrib2GridDecoder;\n  private readonly concurrency: number;\n')
          t = t.replace('    this.areaGridDecoder = options.areaGridDecoder ?? new Wgrib2GridDecoder();\n', '    this.areaGridDecoder = options.areaGridDecoder ?? new Wgrib2GridDecoder();\n    this.concurrency = options.concurrency ?? DEFAULT_AIGFS_STEP_CONCURRENCY;\n')
          old = '''    const profiles: AigfsProfileResult[] = [];
    for (const forecastHour of forecastHours) {
      profiles.push(await this.profileAt(
        run,
        aigfsValidTime(run, forecastHour),
        request.geometry,
        selection,
      ));
    }'''
          new = '''    const point = request.geometry;
    const profiles = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.profileAt(
        run,
        aigfsValidTime(run, forecastHour),
        point,
        selection,
      ),
    );'''
          if old not in t: raise SystemExit('AIGFS point range pattern missing')
          t = t.replace(old, new)
          old = '''    const batches: any[] = [];
    for (const forecastHour of forecastHours) {
      batches.push(await this.pointsAt(
        run,
        aigfsValidTime(run, forecastHour),
        request.geometry.points,
        selection,
      ));
    }'''
          new = '''    const points = request.geometry.points;
    const batches = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.pointsAt(
        run,
        aigfsValidTime(run, forecastHour),
        points,
        selection,
      ) as Promise<any>,
    );'''
          if old not in t: raise SystemExit('AIGFS points range pattern missing')
          t = t.replace(old, new)
          old = '''    const results: any[] = [];
    for (const forecastHour of forecastHours) {
      results.push(await this.getInstantDiagnostic({
        ...request,
        time: { at: aigfsValidTime(run, forecastHour).toISOString() },
        forecast: { ...request.forecast, run: run.toISOString() },
      } as DiagnoseAtmosphereRequest, run));
    }'''
          new = '''    const results = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.getInstantDiagnostic({
        ...request,
        time: { at: aigfsValidTime(run, forecastHour).toISOString() },
        forecast: { ...request.forecast, run: run.toISOString() },
      } as DiagnoseAtmosphereRequest, run) as Promise<any>,
    );'''
          if old not in t: raise SystemExit('AIGFS diagnostic range pattern missing')
          t = t.replace(old, new)
          p.write_text(t)

          # ICON-D2: same bounded range contract.
          p = Path('src/core/icon-d2.ts')
          t = p.read_text()
          t = t.replace('import { computeAreaDistribution } from "./area-distribution.js";\n', 'import { computeAreaDistribution } from "./area-distribution.js";\nimport { mapConcurrent } from "./concurrency.js";\n')
          t = t.replace('const MAX_NATIVE_STEPS = 49;\n', 'const MAX_NATIVE_STEPS = 49;\nexport const DEFAULT_ICON_D2_STEP_CONCURRENCY = 4;\n')
          t = t.replace('  areaGridDecoder?: Wgrib2GridDecoder;\n}', '  areaGridDecoder?: Wgrib2GridDecoder;\n  concurrency?: number;\n}')
          t = t.replace('  private readonly areaGridDecoder: Wgrib2GridDecoder;\n', '  private readonly areaGridDecoder: Wgrib2GridDecoder;\n  private readonly concurrency: number;\n')
          t = t.replace('    this.areaGridDecoder = options.areaGridDecoder ?? new Wgrib2GridDecoder();\n', '    this.areaGridDecoder = options.areaGridDecoder ?? new Wgrib2GridDecoder();\n    this.concurrency = options.concurrency ?? DEFAULT_ICON_D2_STEP_CONCURRENCY;\n')
          old = '''    const profiles: IconD2ProfileResult[] = [];
    for (const forecastHour of forecastHours) {
      profiles.push(await this.profileAt(
        run,
        iconD2ValidTime(run, forecastHour),
        request.geometry,
        selection,
      ));
    }'''
          new = '''    const point = request.geometry;
    const profiles = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.profileAt(
        run,
        iconD2ValidTime(run, forecastHour),
        point,
        selection,
      ),
    );'''
          if old not in t: raise SystemExit('ICON-D2 point range pattern missing')
          t = t.replace(old, new)
          old = '''    const batches: any[] = [];
    for (const forecastHour of forecastHours) {
      batches.push(await this.pointsAt(
        run,
        iconD2ValidTime(run, forecastHour),
        request.geometry.points,
        selection,
      ));
    }'''
          new = '''    const points = request.geometry.points;
    const batches = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.pointsAt(
        run,
        iconD2ValidTime(run, forecastHour),
        points,
        selection,
      ) as Promise<any>,
    );'''
          if old not in t: raise SystemExit('ICON-D2 points range pattern missing')
          t = t.replace(old, new)
          old = '''    const results: any[] = [];
    for (const forecastHour of forecastHours) {
      results.push(await this.getInstantDiagnostic({
        ...request,
        time: { at: iconD2ValidTime(run, forecastHour).toISOString() },
        forecast: { ...request.forecast, run: run.toISOString() },
      } as DiagnoseAtmosphereRequest, run));
    }'''
          new = '''    const results = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.getInstantDiagnostic({
        ...request,
        time: { at: iconD2ValidTime(run, forecastHour).toISOString() },
        forecast: { ...request.forecast, run: run.toISOString() },
      } as DiagnoseAtmosphereRequest, run) as Promise<any>,
    );'''
          if old not in t: raise SystemExit('ICON-D2 diagnostic range pattern missing')
          t = t.replace(old, new)
          p.write_text(t)

          # AROME: bounded point and point-matrix ranges.
          p = Path('src/core/arome.ts')
          t = p.read_text()
          t = t.replace('import { computeAreaDistribution } from "./area-distribution.js";\n', 'import { computeAreaDistribution } from "./area-distribution.js";\nimport { mapConcurrent } from "./concurrency.js";\n')
          t = t.replace('const MAX_NATIVE_STEPS = 52;\n', 'const MAX_NATIVE_STEPS = 52;\nexport const DEFAULT_AROME_STEP_CONCURRENCY = 4;\n')
          t = t.replace('  areaGridDecoder?: Wgrib2GridDecoder;\n}', '  areaGridDecoder?: Wgrib2GridDecoder;\n  concurrency?: number;\n}')
          t = t.replace('  private readonly areaGridDecoder: Wgrib2GridDecoder;\n', '  private readonly areaGridDecoder: Wgrib2GridDecoder;\n  private readonly concurrency: number;\n')
          t = t.replace('    this.areaGridDecoder = options.areaGridDecoder ?? new Wgrib2GridDecoder();\n', '    this.areaGridDecoder = options.areaGridDecoder ?? new Wgrib2GridDecoder();\n    this.concurrency = options.concurrency ?? DEFAULT_AROME_STEP_CONCURRENCY;\n')
          old = '''    const points: AromePointResult[] = [];
    for (const forecastHour of forecastHours) {
      points.push(await this.pointAt(
        run,
        aromeValidTime(run, forecastHour),
        request.geometry,
        selection,
      ));
    }'''
          new = '''    const point = request.geometry;
    const points = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.pointAt(
        run,
        aromeValidTime(run, forecastHour),
        point,
        selection,
      ),
    );'''
          if old not in t: raise SystemExit('AROME point range pattern missing')
          t = t.replace(old, new)
          old = '''    const batches: any[] = [];
    for (const forecastHour of forecastHours) {
      batches.push(await this.pointsAt(
        run,
        aromeValidTime(run, forecastHour),
        request.geometry.points,
        selection,
      ));
    }'''
          new = '''    const requestedPoints = request.geometry.points;
    const batches = await mapConcurrent(
      forecastHours,
      this.concurrency,
      (forecastHour) => this.pointsAt(
        run,
        aromeValidTime(run, forecastHour),
        requestedPoints,
        selection,
      ) as Promise<any>,
    );'''
          if old not in t: raise SystemExit('AROME points range pattern missing')
          t = t.replace(old, new)
          p.write_text(t)

          # Architecture guard: range-capable deterministic services must not regress to serial forecast-hour loops.
          p = Path('test/architecture-boundaries.test.ts')
          t = p.read_text()
          marker = '''  it("keeps the public unified API module as a composition barrel", async () => {'''
          addition = '''  it("keeps independent deterministic forecast ranges bounded-concurrent", async () => {
    const files = [
      "src/core/aifs.ts",
      "src/core/aigfs.ts",
      "src/core/arome.ts",
      "src/core/icon-d2.ts",
      "src/core/ifs-spatiotemporal.ts",
      "src/core/time-series.ts",
    ];
    for (const path of files) {
      const source = await readFile(path, "utf8");
      expect(source, path).not.toMatch(/for\\s*\\(const forecastHour of forecastHours\\)\\s*\\{[\\s\\S]{0,160}?await/);
    }
  });

'''
          if marker not in t: raise SystemExit('architecture test insertion marker missing')
          t = t.replace(marker, addition + marker)
          p.write_text(t)

          # Document execution and provider invariants in the architecture contract.
          p = Path('docs/ARCHITECTURE.md')
          t = p.read_text()
          old = '''Composition is allowed to be serial or bounded-concurrent according to the source contract. The public result reports what was resolved; it does not pretend every backend has identical reuse or parallelism characteristics.
'''
          new = '''Independent forecast steps are bounded-concurrent by default. Serial execution is reserved for an explicit provider/data dependency, never as an accidental implementation default. The public result reports what was resolved; it does not pretend every backend has identical reuse or parallelism characteristics.

### Execution-efficiency invariants

WFG treats computational efficiency as part of the application architecture:

- resolve shared state such as model initialization once per composed request;
- execute independent time steps concurrently with a bounded worker pool;
- do not put one complete member/range on the critical path merely to discover shared run state;
- reuse one downloaded artifact across points, members or derived operations whenever the provider product permits it;
- avoid nested concurrency policies that attempt to replace provider access control.

Application-level concurrency is an optimization limit, not permission to exceed an upstream contract. Every cache miss and retry still passes through `src/access/`, whose provider policy is the authoritative hard ceiling for concurrency and pacing. Raising a core worker count may increase useful overlap for cache hits, decoding or independent provider work, but it must never bypass `UpstreamAccessPolicy`.
'''
          if old not in t: raise SystemExit('architecture composition paragraph missing')
          t = t.replace(old, new)
          p.write_text(t)
          PY
      - run: npm run typecheck
      - run: npx vitest run test/architecture-boundaries.test.ts test/aigfs.test.ts test/icon-d2.test.ts test/arome.test.ts
      - run: npm run build
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-efficiency-pass.yml
          git add src/core/aigfs.ts src/core/icon-d2.ts src/core/arome.ts test/architecture-boundaries.test.ts docs/ARCHITECTURE.md
          git commit -m "perf: parallelize independent deterministic ranges"
          git push origin HEAD:perf/request-budget-and-batched-execution

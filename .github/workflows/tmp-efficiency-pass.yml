name: temporary-efficiency-pass

on:
  push:
    branches:
      - perf/request-budget-and-batched-execution

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-budget-and-batched-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python scripts/tmp_efficiency_patch.py
      - run: npm run typecheck
      - run: npx vitest run test/architecture-boundaries.test.ts test/aigfs.test.ts test/icon-d2.test.ts test/arome.test.ts
      - run: npm run build
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-efficiency-pass.yml scripts/tmp_efficiency_patch.py
          git add src/core/aigfs.ts src/core/icon-d2.ts src/core/arome.ts test/architecture-boundaries.test.ts docs/ARCHITECTURE.md
          git commit -m "perf: parallelize independent deterministic ranges"
          git push origin HEAD:perf/request-budget-and-batched-execution

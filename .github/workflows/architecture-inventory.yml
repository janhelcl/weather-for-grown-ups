name: Architecture inventory

on:
  pull_request:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect stale import inventory
        shell: bash
        run: |
          {
            echo '=== decoder contract occurrences ==='
            grep -RInE '\b(DecodedValue|ForecastInterval|GribDecoderName|GridPoint)\b' src test || true
            echo
            echo '=== GEFS cadence occurrences ==='
            grep -RInE 'GEFS_(MAX_FORECAST_HOUR|FORECAST_STEP_HOURS|TOTAL_NATIVE_FORECAST_STEPS)' src test || true
          } > architecture-imports.txt
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-imports
          path: architecture-imports.txt

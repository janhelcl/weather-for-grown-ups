name: PR GDEX point NetCDF debug

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-gdex-point-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GDEX point NetCDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq netcdf-bin
          url='https://tds.gdex.ucar.edu/thredds/ncss/grid/files/g/d084001/2026/20260824/gfs.0p25.2026082400.f006.grib2?var=Temperature_isobaric&latitude=50&longitude=14&time=all&accept=netCDF'
          curl --fail --show-error --silent --max-time 90 "$url" -o /tmp/point.nc
          ncdump -h /tmp/point.nc
          ncdump /tmp/point.nc | tail -n 120

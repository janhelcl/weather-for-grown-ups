name: PR55 bundled decoder live smoke

on:
  pull_request:

jobs:
  live:
    if: github.event.pull_request.number == 55
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WFG_DECODER: gribberish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Probe live statistical GRIB metadata
        run: npx tsx scripts/live-debug-statistical.ts
      - name: Exercise bundled decoder against live NOAA data
        run: npm run test:live:bundled

name: PR55 bundled decoder live smoke

on:
  pull_request:

permissions:
  contents: write

jobs:
  live:
    if: github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WFG_DECODER: gribberish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply compact named-level compatibility fix
        run: python .github/pr55-fix-compact-levels.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Probe live statistical GRIB metadata
        run: npx tsx scripts/live-debug-statistical.ts
      - name: Exercise bundled decoder against live NOAA data
        run: npm run test:live:bundled
      - name: Commit validated compatibility fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/grib/gribberish-runtime.ts test/gribberish-runtime.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Handle compact gribberish named levels"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

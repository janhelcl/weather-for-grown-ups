name: PR ECMWF AIFS live

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**/aifs*.ts"
      - "src/sources/ifs-open-data.ts"
      - "src/sources/ifs-open-data-access-policy.ts"
      - "src/catalog/models.ts"
      - "src/schema/unified-api.ts"
      - "scripts/live-smoke-aifs.ts"
      - ".github/workflows/pr-aifs-live.yml"
      - "package.json"

concurrency:
  group: pr-aifs-live-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned live-test environment
        run: docker build --target live-test -t weather-for-grown-ups:live-test .
      - name: Query live ECMWF AIFS Open Data
        run: docker run --rm weather-for-grown-ups:live-test npm run test:live:aifs

name: PR55 provenance migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python .github/pr55-migrate.py
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - name: Commit migration if green
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src test
          git commit -m "Report actual bundled decoder provenance"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

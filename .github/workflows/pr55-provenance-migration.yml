name: PR55 provenance migration

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.pull_request.number == 55 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply provenance migration and coverage tests
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def edit(path, fn):
              p = Path(path)
              before = p.read_text()
              after = fn(before)
              if after == before:
                  raise SystemExit(f"expected edit produced no change: {path}")
              p.write_text(after)

          def replace(path, old, new, expected=None):
              def apply(s):
                  count = s.count(old)
                  if expected is not None and count != expected:
                      raise SystemExit(f"{path}: expected {expected} occurrences, found {count}: {old!r}")
                  if count == 0:
                      raise SystemExit(f"{path}: missing expected text: {old!r}")
                  return s.replace(old, new)
              edit(path, apply)

          # Public provenance contract: both bundled and explicit-native engines are valid.
          for p in Path("src/schema").glob("*.ts"):
              s = p.read_text()
              if 'decoder: z.literal("wgrib2")' in s:
                  p.write_text(s.replace(
                      'decoder: z.literal("wgrib2")',
                      'decoder: z.enum(["gribberish", "wgrib2"])',
                  ))

          replace(
              "src/core/types.ts",
              'export interface SourceProvenance {\n  provider: ProfileProvider;\n  access: ProfileAccessMethod;\n  decoder: "wgrib2";\n}',
              'export type GribDecoderName = "gribberish" | "wgrib2";\n\nexport interface SourceProvenance {\n  provider: ProfileProvider;\n  access: ProfileAccessMethod;\n  decoder: GribDecoderName;\n}',
              1,
          )
          replace("src/core/types.ts", 'decoder: "wgrib2";', 'decoder: GribDecoderName;', 3)

          # Decoder instances identify the engine actually doing the decode.
          replace(
              "src/grib/wgrib2.ts",
              'import type { DecodedValue } from "../core/types.js";',
              'import type { DecodedValue, GribDecoderName } from "../core/types.js";',
              1,
          )
          replace(
              "src/grib/wgrib2.ts",
              'export class Wgrib2Decoder {\n  constructor(private readonly executable = defaultNativeExecutable()) {}',
              'export class Wgrib2Decoder {\n  readonly engine: GribDecoderName;\n\n  constructor(private readonly executable = defaultNativeExecutable()) {\n    this.engine = executable === undefined ? "gribberish" : "wgrib2";\n  }',
              1,
          )

          replace(
              "src/grib/wgrib2-grid.ts",
              'import { execa } from "execa";',
              'import { execa } from "execa";\nimport type { GribDecoderName } from "../core/types.js";',
              1,
          )
          replace(
              "src/grib/wgrib2-grid.ts",
              'export class Wgrib2GridDecoder {\n  constructor(\n    private readonly executable = defaultNativeExecutable(),\n    private readonly runner: Wgrib2GridCommandRunner = defaultRunner,\n  ) {}',
              'export class Wgrib2GridDecoder {\n  readonly engine: GribDecoderName;\n\n  constructor(\n    private readonly executable = defaultNativeExecutable(),\n    private readonly runner: Wgrib2GridCommandRunner = defaultRunner,\n  ) {\n    this.engine = executable === undefined ? "gribberish" : "wgrib2";\n  }',
              1,
          )

          replace(
              "src/grib/wgrib2-stats.ts",
              'import type { ForecastInterval } from "../core/types.js";',
              'import type { ForecastInterval, GribDecoderName } from "../core/types.js";',
              1,
          )
          replace(
              "src/grib/wgrib2-stats.ts",
              'export class Wgrib2StatsDecoder {\n  constructor(\n    private readonly executable = defaultNativeExecutable(),\n    private readonly runner: Wgrib2CommandRunner = defaultRunner,\n  ) {}',
              'export class Wgrib2StatsDecoder {\n  readonly engine: GribDecoderName;\n\n  constructor(\n    private readonly executable = defaultNativeExecutable(),\n    private readonly runner: Wgrib2CommandRunner = defaultRunner,\n  ) {\n    this.engine = executable === undefined ? "gribberish" : "wgrib2";\n  }',
              1,
          )

          # GFS direct point service.
          replace(
              "src/core/profile.ts",
              '  ForecastInterval,\n  NonIsobaricFieldResult,',
              '  ForecastInterval,\n  GribDecoderName,\n  NonIsobaricFieldResult,',
              1,
          )
          replace(
              "src/core/profile.ts",
              'export interface PointDecoder {\n  extractPoint(path: string, longitude: number, latitude: number): Promise<DecodedValue[]>;\n}',
              'export interface PointDecoder {\n  readonly engine?: GribDecoderName;\n  extractPoint(path: string, longitude: number, latitude: number): Promise<DecodedValue[]>;\n}',
              1,
          )
          replace("src/core/profile.ts", 'decoder: "wgrib2",', 'decoder: this.decoder.engine ?? "wgrib2",', 1)

          # GEFS point decoder interface plus all direct users.
          replace(
              "src/core/gefs-ensemble.ts",
              'import type { DecodedValue, FieldTemporalResult } from "./types.js";',
              'import type { DecodedValue, FieldTemporalResult, GribDecoderName } from "./types.js";',
              1,
          )
          replace(
              "src/core/gefs-ensemble.ts",
              'export interface GefsPointDecoder {\n  extractPoint(path: string, longitude: number, latitude: number): Promise<DecodedValue[]>;\n}',
              'export interface GefsPointDecoder {\n  readonly engine?: GribDecoderName;\n  extractPoint(path: string, longitude: number, latitude: number): Promise<DecodedValue[]>;\n}',
              1,
          )
          for path in [
              "src/core/gefs-ensemble.ts",
              "src/core/gefs-ensemble-profile.ts",
              "src/core/gefs-member-bundle.ts",
              "src/core/gefs-batch-points.ts",
              "src/core/gefs-points-bundle.ts",
              "src/core/gefs-parcel-diagnostics.ts",
          ]:
              replace(path, 'decoder: "wgrib2",', 'decoder: this.decoder.engine ?? "wgrib2",', 1)

          # GFS area decoders may use either the bundled or native engine.
          replace(
              "src/core/area-summary.ts",
              '  FieldTemporalResult,\n  NonIsobaricFieldLevelResult,',
              '  FieldTemporalResult,\n  GribDecoderName,\n  NonIsobaricFieldLevelResult,',
              1,
          )
          replace(
              "src/core/area-summary.ts",
              'export interface AreaStatsDecoder {\n  summarizeBox',
              'export interface AreaStatsDecoder {\n  readonly engine?: GribDecoderName;\n  summarizeBox',
              1,
          )
          replace(
              "src/core/area-summary.ts",
              'export interface AreaGridDecoder {\n  extractBox',
              'export interface AreaGridDecoder {\n  readonly engine?: GribDecoderName;\n  extractBox',
              1,
          )
          replace(
              "src/core/area-summary.ts",
              'source: areaSource(cached.cacheHit),',
              'source: areaSource(\n        cached.cacheHit,\n        distributionRequested ? this.gridDecoder.engine ?? "wgrib2" : this.decoder.engine ?? "wgrib2",\n      ),',
              2,
          )
          replace(
              "src/core/area-summary.ts",
              'function areaSource(cacheHit: boolean): AreaSummaryResult["source"] {\n  return {\n    provider: "NOAA NOMADS",\n    access: "nomads_grib_filter",\n    decoder: "wgrib2",',
              'function areaSource(cacheHit: boolean, decoder: GribDecoderName): AreaSummaryResult["source"] {\n  return {\n    provider: "NOAA NOMADS",\n    access: "nomads_grib_filter",\n    decoder,',
              1,
          )

          # GEFS area service.
          replace(
              "src/core/gefs-area-summary.ts",
              'import { computeAreaDistribution } from "./area-distribution.js";',
              'import { computeAreaDistribution } from "./area-distribution.js";\nimport type { GribDecoderName } from "./types.js";',
              1,
          )
          replace(
              "src/core/gefs-area-summary.ts",
              'export interface GefsAreaGridDecoder {\n  extractBox',
              'export interface GefsAreaGridDecoder {\n  readonly engine?: GribDecoderName;\n  extractBox',
              1,
          )
          replace(
              "src/core/gefs-area-summary.ts",
              'decoder: "wgrib2" as const,',
              'decoder: this.gridDecoder.engine ?? "wgrib2",',
              1,
          )

          # Composite GFS operations propagate, rather than overwrite, provenance.
          replace(
              "src/core/batch-points.ts",
              'if (profile.source.provider !== "NOAA AWS Open Data" || profile.source.access !== "s3_range") {',
              'if (\n        profile.source.provider !== "NOAA AWS Open Data"\n        || profile.source.access !== "s3_range"\n        || profile.source.decoder !== profiles[0]!.source.decoder\n      ) {',
              1,
          )
          replace("src/core/batch-points.ts", 'decoder: "wgrib2",', 'decoder: profiles[0]!.source.decoder,', 1)

          replace(
              "src/core/points-time-series.ts",
              '        || batch.source.access !== "s3_range"\n        || batch.source.decoder !== "wgrib2"',
              '        || batch.source.access !== "s3_range"\n        || batch.source.decoder !== first.source.decoder',
              1,
          )
          replace("src/core/points-time-series.ts", 'decoder: "wgrib2",', 'decoder: first.source.decoder,', 1)

          replace(
              "src/core/run-comparison.ts",
              '  FieldTemporalResult,\n  GridPoint,',
              '  FieldTemporalResult,\n  GribDecoderName,\n  GridPoint,',
              1,
          )
          replace("src/core/run-comparison.ts", 'decoder: "wgrib2";', 'decoder: GribDecoderName;', 1)
          replace(
              "src/core/run-comparison.ts",
              'assertSnapshotInvariant(profile, expectedRun, validTime.toISOString(), query.latitude, query.longitude, first.gridPoint);',
              'assertSnapshotInvariant(\n        profile,\n        expectedRun,\n        validTime.toISOString(),\n        query.latitude,\n        query.longitude,\n        first.gridPoint,\n        first.source.decoder,\n      );',
              1,
          )
          replace("src/core/run-comparison.ts", 'decoder: "wgrib2",', 'decoder: first.source.decoder,', 1)
          replace(
              "src/core/run-comparison.ts",
              '  gridPoint: GridPoint,\n): void {',
              '  gridPoint: GridPoint,\n  expectedDecoder: GribDecoderName,\n): void {',
              1,
          )
          replace(
              "src/core/run-comparison.ts",
              '    || profile.source.access !== "s3_range"\n    || profile.source.decoder !== "wgrib2"',
              '    || profile.source.access !== "s3_range"\n    || profile.source.decoder !== expectedDecoder',
              1,
          )

          # Composite GEFS operations likewise preserve one consistent decoder identity.
          replace(
              "src/core/gefs-points-timeseries.ts",
              '        || batch.source.decoder !== "wgrib2"',
              '        || batch.source.decoder !== first.source.decoder',
              1,
          )
          replace("src/core/gefs-points-timeseries.ts", 'decoder: "wgrib2",', 'decoder: first.source.decoder,', 1)

          replace(
              "src/core/gefs-points-bundle-timeseries.ts",
              '    || batch.source.decoder !== "wgrib2"',
              '    || batch.source.decoder !== expected.first.source.decoder',
              1,
          )
          replace("src/core/gefs-points-bundle-timeseries.ts", 'decoder: "wgrib2",', 'decoder: first.source.decoder,', 1)

          composite_sources = {
              "src/core/gefs-run-comparison.ts": 'results[0]!.source.decoder',
              "src/core/gefs-diagnostic-timeseries.ts": 'results[0]!.result.source.decoder',
              "src/core/gefs-bundle-timeseries.ts": 'results[0]!.source.decoder',
              "src/core/gefs-ensemble-timeseries.ts": 'results[0]!.source.decoder',
          }
          for path, expr in composite_sources.items():
              replace(path, 'decoder: "wgrib2",', f'decoder: {expr},', 1)

          # README now reflects the actual npm-first install contract.
          p = Path("README.md")
          s = p.read_text()
          pattern = re.compile(r'## Install\n.*?\nSee \[INSTALL\.md\]\(INSTALL\.md\) for Docker, npm, stdio MCP, Streamable HTTP MCP, hosting, and release details\.', re.S)
          replacement = '''## Install

### npx — recommended

With Node.js 20 or newer, WFG can be run directly from npm with no separate GRIB installation:

```bash
npx weather-for-grown-ups --help
npx weather-for-grown-ups catalog --search cloud --json
```

The npm package includes the GRIB2 decoder. Native `wgrib2` is **not required** for normal CLI or MCP use.

The same package starts either MCP transport:

```bash
npx weather-for-grown-ups mcp
npx weather-for-grown-ups mcp-http
```

A global install remains optional for frequent local use:

```bash
npm install -g weather-for-grown-ups
weather-for-grown-ups --help
```

Docker remains available for pinned deployments and additionally includes native `wgrib2 3.8.0` as an explicit compatibility/debug path.

See [INSTALL.md](INSTALL.md) for npx, Docker, npm, stdio MCP, Streamable HTTP MCP, hosting, and release details.'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"README install section replacement count={count}")
          s2 = s2.replace(
              'WFG reads `.idx` inventories, downloads selected GRIB byte ranges, caches immutable slices, and samples locally with `wgrib2`.',
              'WFG reads `.idx` inventories, downloads selected GRIB byte ranges, caches immutable slices, and samples locally with its bundled GRIB2 decoder by default.',
          )
          p.write_text(s2)

          # Cover branch-heavy bundled decoder semantics rather than weakening coverage thresholds.
          test = Path("test/gribberish-runtime.test.ts")
          s = test.read_text()
          marker = '\ndescribe("bundled GRIB2 edge semantics", () => {'
          if marker in s:
              raise SystemExit("edge semantics tests already present")
          s += r'''

describe("bundled GRIB2 edge semantics", () => {
  it.each([
    ["TCDC:202608240600: in low cloud layer:Forecast", "low cloud layer"],
    ["TCDC:202608240600: in middle cloud layer:Forecast", "middle cloud layer"],
    ["TCDC:202608240600: in high cloud layer:Forecast", "high cloud layer"],
    ["TCDC:202608240600: in convective cloud layer:Forecast", "convective cloud layer"],
    ["TCDC:202608240600: in boundary layer cloud layer:Forecast", "boundary layer cloud layer"],
    ["HGT:202608240600: in cloud ceiling:Forecast", "cloud ceiling"],
    ["HGT:202608240600: in convective cloud bottom level:Forecast", "convective cloud bottom level"],
    ["HGT:202608240600: in low cloud bottom level:Forecast", "low cloud bottom level"],
    ["HGT:202608240600: in middle cloud bottom level:Forecast", "middle cloud bottom level"],
    ["HGT:202608240600: in high cloud bottom level:Forecast", "high cloud bottom level"],
    ["HGT:202608240600: in convective cloud top level:Forecast", "convective cloud top level"],
    ["HGT:202608240600: in low cloud top level:Forecast", "low cloud top level"],
    ["HGT:202608240600: in middle cloud top level:Forecast", "middle cloud top level"],
    ["HGT:202608240600: in high cloud top level:Forecast", "high cloud top level"],
    ["PRMSL:202608240600: in mean sea level:Forecast", "mean sea level"],
  ])("maps named vertical alias %s", (key, namedVertical) => {
    const [decoded] = decodePointMessages([fakeMessage({ key, code: key.split(":")[0] })], 14, 50);
    expect(decoded).toMatchObject({ namedVertical });
  });

  it("normalizes encoded pressure values and explicit zero-surface keys", () => {
    const [pressure] = decodePointMessages([
      fakeMessage({ key: "TMP:202608240600:85000 in mb:Forecast" }),
    ], 14, 50);
    const [surface] = decodePointMessages([
      fakeMessage({ key: "PRES:202608240600:0 in surface:Forecast", code: "PRES" }),
    ], 14, 50);
    expect(pressure?.pressureHpa).toBe(850);
    expect(surface?.surface).toBe(true);
  });

  it("normalizes both pressure-difference layer bounds", () => {
    const [decoded] = decodePointMessages([
      fakeMessage({
        key: "CAPE:202608240600:18000 in level at specified pressure difference from ground to level:9000 in level at specified pressure difference from ground to level:Forecast",
        code: "CAPE",
      }),
    ], 14, 50);
    expect(decoded?.namedVertical).toBe("180-90 mb above ground");
  });

  it("skips unsupported vertical coordinates", () => {
    expect(decodePointMessages([
      fakeMessage({ key: "TMP:202608240600: in some unsupported vertical:Forecast" }),
    ], 14, 50)).toEqual([]);
  });

  it("rejects an interval selector when the selected message has no interval", () => {
    const message = fakeMessage({ key: "APCP:202608240600: in surface:Accumulation Forecast", code: "APCP" });
    expect(() => temporalForSelector(message, {
      code: "APCP",
      gribLevel: "surface",
      temporalSemantics: "accumulation",
    })).toThrow(/without a forecast interval/);
  });

  it("rejects misaligned decoded arrays", () => {
    const message = fakeMessage({
      key: "TMP:202608240600:850 in mb:Forecast",
      latitudes: [50],
      longitudes: [14],
      values: [280],
    });
    expect(() => gridPointsInBox(message, {
      westLongitude: 13,
      eastLongitude: 15,
      southLatitude: 49,
      northLatitude: 51,
    })).toThrow(/misaligned grid arrays/);
  });

  it("rejects boxes without defined points", () => {
    const message = fakeMessage({
      key: "TMP:202608240600:850 in mb:Forecast",
      values: [Number.NaN, Number.NaN, Number.NaN, Number.NaN],
    });
    expect(() => gridPointsInBox(message, {
      westLongitude: 13,
      eastLongitude: 15,
      southLatitude: 49,
      northLatitude: 51,
    })).toThrow(/no defined GFS grid points/);
  });
});
'''
          test.write_text(s)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - name: Commit migration if green
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src test
          git commit -m "Report actual bundled decoder provenance"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: Finalize v0.5.2 release notes

on:
  push:
    branches:
      - release/v0.5.2

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.5.2
      - name: Stamp release notes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/RELEASES.md")
          text = path.read_text()
          old_heading = "## Unreleased\n"
          new_heading = "## v0.5.2 — 2026-09-06\n"
          if old_heading in text:
              text = text.replace(old_heading, new_heading, 1)
          elif new_heading not in text:
              raise SystemExit("release heading not found")

          marker = "### stdio MCP smoke coverage\n"
          validation = """### Release validation\n\nThe v0.5.2 release candidate validates the source contract that this release actually ships rather than depending on the retired NCEI NCSS overlap path:\n\n- Node.js 20/24 typecheck, offline tests, coverage, build, CLI/package smoke tests and Docker validation pass;\n- live GFS operational parity confirms NOMADS and NOAA AWS agree for both 0.25° and 0.5° products;\n- live `gfs-analysis` routing confirms a recent analysis resolves through NOAA AWS Open Data (`s3_range`) while an older Grid-4 point analysis resolves through NCEI fileServer (`ncei_thredds_fileserver`);\n- the former recent operational ↔ NCEI THREDDS archived-forecast overlap check is not a release gate: current GFS data is served through AWS while the legacy 0.5° archived-forecast implementation still uses the separate NCEI NCSS path. The dedicated archive-equivalence smoke remains available for that legacy transport rather than being treated as evidence about `gfs-analysis` health.\n\n"""
          if validation not in text:
              if marker not in text:
                  raise SystemExit("release validation insertion point not found")
              text = text.replace(marker, validation + marker, 1)

          path.write_text(text)
          PY
      - name: Commit release notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASES.md
          if git diff --cached --quiet; then
            echo "Release notes already finalized."
            exit 0
          fi
          git commit -m "docs: finalize v0.5.2 release notes"
          git push origin HEAD:release/v0.5.2

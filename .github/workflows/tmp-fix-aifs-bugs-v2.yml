name: Temporary AIFS bugfix v2

on:
  push:
    branches:
      - fix/aifs-decoder-units-and-concurrency

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged patch and typing fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/tmp-fix-aifs-bugs.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          staged = textwrap.dedent(source[start:end])
          exec(compile(staged, 'staged-aifs-patch.py', 'exec'))

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected one occurrence in {path}, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/core/aifs.ts',
              '''    const profiles = await mapConcurrent(\n      forecastHours,\n      this.concurrency,\n      (forecastHour) => this.profileAt(\n        run,\n        aifsValidTime(run, forecastHour),\n        request.geometry,\n        selection,\n      ),\n    );\n''',
              '''    const point = request.geometry;\n    const profiles = await mapConcurrent<number, AifsProfileResult>(\n      forecastHours,\n      this.concurrency,\n      (forecastHour) => this.profileAt(\n        run,\n        aifsValidTime(run, forecastHour),\n        point,\n        selection,\n      ),\n    );\n''',
          )
          replace_once(
              'src/core/aifs.ts',
              '''    const batches = await mapConcurrent(\n      forecastHours,\n      this.concurrency,\n      (forecastHour) => this.pointsAt(\n        run,\n        aifsValidTime(run, forecastHour),\n        request.geometry.points,\n        selection,\n      ),\n    );\n''',
              '''    const points = request.geometry.points;\n    const batches = await mapConcurrent<number, any>(\n      forecastHours,\n      this.concurrency,\n      (forecastHour) => this.pointsAt(\n        run,\n        aifsValidTime(run, forecastHour),\n        points,\n        selection,\n      ) as Promise<any>,\n    );\n''',
          )
          replace_once(
              'src/core/aifs.ts',
              '''    const results = await mapConcurrent(\n      forecastHours,\n      this.concurrency,\n      (forecastHour) => this.getInstantDiagnostic({\n        ...request,\n        time: { at: aifsValidTime(run, forecastHour).toISOString() },\n        forecast: { ...request.forecast, run: run.toISOString() },\n      } as DiagnoseAtmosphereRequest, run),\n    );\n''',
              '''    const results = await mapConcurrent<number, any>(\n      forecastHours,\n      this.concurrency,\n      (forecastHour) => this.getInstantDiagnostic({\n        ...request,\n        time: { at: aifsValidTime(run, forecastHour).toISOString() },\n        forecast: { ...request.forecast, run: run.toISOString() },\n      } as DiagnoseAtmosphereRequest, run) as Promise<any>,\n    );\n''',
          )
          PY
      - name: Typecheck
        run: npm run typecheck
      - name: Test focused AIFS suites
        run: npx vitest run test/aifs.test.ts test/aifs-ens.test.ts test/aifs-ens-open-data-cache.test.ts
      - name: Build
        run: npm run build
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-fix-aifs-bugs.yml .github/workflows/tmp-fix-aifs-bugs-v2.yml
          git add src/core/aifs.ts src/catalog/aifs.ts test/aifs.test.ts scripts/live-smoke-aifs.ts src/core/aifs-ens.ts src/cache/aifs-ens-open-data-cache.ts test/aifs-ens-open-data-cache.test.ts
          git commit -m "fix: correct AIFS decoding and range fan-out"
          git push

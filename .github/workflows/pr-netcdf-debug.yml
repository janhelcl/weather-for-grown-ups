name: PR NetCDF debug

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-netcdf-debug-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GDEX NetCDF bbox and dependency lock delta
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq netcdf-bin
          url='https://tds.gdex.ucar.edu/thredds/ncss/grid/files/g/d084001/2026/20260824/gfs.0p25.2026082400.f006.grib2?var=Temperature_isobaric&north=50.5&south=49.5&east=14.5&west=13.5&time=all&accept=netCDF&vertCoord=85000'
          curl --fail --show-error --silent --max-time 90 "$url" -o /tmp/gdex.nc
          echo '=== NCDUMP HEADER ==='
          ncdump -h /tmp/gdex.nc
          echo '=== NCDUMP DATA ==='
          ncdump -v lat,lon,latitude,longitude,Temperature_isobaric /tmp/gdex.nc 2>&1 || ncdump /tmp/gdex.nc | head -n 220
          echo '=== NETCDFJS LOCK DIFF ==='
          npm install --package-lock-only --save netcdfjs@^4.0.0 --ignore-scripts --no-audit --no-fund
          git diff -- package.json package-lock.json
